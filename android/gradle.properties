# ChuckStation 3 — Android Gradle properties.

# JVM args for the Gradle daemon. Bump heap so the NDK build doesn't OOM.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Run Gradle in parallel + configure on demand.
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Native build
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=34

# Kotlin
kotlin.code.style=official
