# ChuckStation 3 — desktop CI.
#
# Builds the SDL frontend across an OS x compiler matrix, runs clang-format
# and clang-tidy on changed files, caches build state via ccache +
# actions/cache, and uploads the resulting binary as a workflow artifact.
#
# The Android APK build is a separate workflow (.github/workflows/android.yml)
# because its toolchain (NDK + Gradle) is fundamentally different.

name: Desktop build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Lint pass — fast, runs on every push.
  # -------------------------------------------------------------------------
  lint:
    name: Lint (clang-format + clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for changed-files detection

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18 cmake

      - name: clang-format --dry-run (changed files only on PRs, full tree on push)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }} -- 'src/*.cpp' 'src/*.hpp' 'src/*.h' 'include/**/*.hpp' 'include/**/*.h' | grep -v '^third_party/' || true)
          else
            FILES=$(find src include -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) | grep -v third_party || true)
          fi
          if [ -z "$FILES" ]; then
            echo "No C++ files to check."
            exit 0
          fi
          echo "Checking files:"
          echo "$FILES"
          echo "$FILES" | xargs clang-format-18 --dry-run --Werror

      - name: cmake configure (for compile_commands.json)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DENABLE_USER_BUILD=OFF \
                -G Ninja
        # We don't build — we only need the compile_commands.json for tidy.

      - name: clang-tidy (changed files only)
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }} -- 'src/*.cpp' | grep -v '^third_party/' || true)
          else
            FILES=$(find src -maxdepth 5 -name '*.cpp' | head -20)
          fi
          if [ -z "$FILES" ]; then
            echo "No source files to tidy."
            exit 0
          fi
          echo "Tidying files:"
          echo "$FILES"
          echo "$FILES" | xargs -r clang-tidy-18 -p build --quiet --warnings-as-errors=''

  # -------------------------------------------------------------------------
  # Build matrix
  # -------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            cmake_generator: Ninja
            artifact_name: ChuckStation3-linux-x64
            artifact_path: build/bin/ChuckStation3
          - os: ubuntu-22.04
            compiler: clang
            cmake_generator: Ninja
            artifact_name: ChuckStation3-linux-x64-clang
            artifact_path: build/bin/ChuckStation3
          - os: macos-14
            compiler: clang
            cmake_generator: Ninja
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64
            artifact_name: ChuckStation3-macos-arm64
            artifact_path: build/bin/ChuckStation3
          - os: windows-2022
            compiler: msvc
            cmake_generator: Ninja
            artifact_name: ChuckStation3-windows-x64
            artifact_path: build/bin/ChuckStation3.exe

    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up MSVC dev shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ninja ccache

      - name: Select GCC
        if: matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc"   >> $GITHUB_ENV
          echo "CXX=g++"  >> $GITHUB_ENV

      - name: Select Clang
        if: matrix.compiler == 'clang' && runner.os != 'Windows'
        run: |
          echo "CC=clang"     >> $GITHUB_ENV
          echo "CXX=clang++"  >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_USER_BUILD=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/bin/ChuckStation3.exe staging/ || true
          else
            cp build/bin/ChuckStation3 staging/ || true
          fi
          # Also drop a copy of the runtime Filesystem template if present.
          if [ -d Filesystem ]; then
            cp -r Filesystem staging/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # Qt6 build — single Windows job for now, matching upstream coverage.
  # -------------------------------------------------------------------------
  qt-build:
    name: Windows / Qt6
    needs: lint
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Set up MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja + ccache
        run: choco install -y ninja ccache

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          arch: win64_msvc2022_64
          version: 6.8.2
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DENABLE_USER_BUILD=ON `
            -DENABLE_QT_BUILD=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=ccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --parallel

      - name: Deploy (windeployqt)
        run: |
          mkdir staging
          move build/bin/ChuckStation3.exe staging
          windeployqt --plugindir staging/Qt6 staging/ChuckStation3.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChuckStation3-windows-qt6
          path: staging/
          if-no-files-found: error
          retention-days: 30
