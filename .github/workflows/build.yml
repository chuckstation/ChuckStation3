# ChuckStation 3 — desktop CI.
#
# Builds the SDL frontend across an OS/compiler matrix and uploads
# the resulting binaries as workflow artifacts.
#
# The Android APK build is a separate workflow (.github/workflows/android.yml)
# because its toolchain (NDK + Gradle) is fundamentally different.

name: Desktop build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Desktop build matrix
  # -------------------------------------------------------------------------
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            cmake_generator: Ninja
            artifact_name: ChuckStation3-linux-x64

          - os: ubuntu-24.04
            compiler: clang
            cmake_generator: Ninja
            artifact_name: ChuckStation3-linux-x64-clang

          - os: macos-14
            compiler: clang
            cmake_generator: Ninja
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64
            artifact_name: ChuckStation3-macos-arm64

          - os: windows-2022
            compiler: msvc
            cmake_generator: Ninja
            artifact_name: ChuckStation3-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Install Ninja and ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Install Ninja and ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja ccache

      - name: Set up MSVC dev shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and ccache (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ninja ccache

      - name: Select GCC
        if: matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Select Clang
        if: matrix.compiler == 'clang' && runner.os != 'Windows'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -G "${{ matrix.cmake_generator }}" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_USER_BUILD=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: |
          cmake --build build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/bin/ChuckStation3.exe staging/
          else
            cp build/bin/ChuckStation3 staging/
          fi

          if [ -d Filesystem ]; then
            cp -r Filesystem staging/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # Qt6 Windows build
  # -------------------------------------------------------------------------
  qt-build:
    name: Windows / Qt6
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Set up MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja and ccache
        run: choco install -y ninja ccache

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          arch: win64_msvc2022_64
          version: 6.8.2
          cache: true

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DENABLE_USER_BUILD=ON \
            -DENABLE_QT_BUILD=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: bash
        run: |
          cmake --build build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel

      - name: Deploy Qt
        shell: bash
        run: |
          mkdir -p staging
          cp build/bin/ChuckStation3.exe staging/
          windeployqt --plugindir staging/Qt6 staging/ChuckStation3.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChuckStation3-windows-qt6
          path: staging/
          if-no-files-found: error
          retention-days: 30
