# ChuckStation 3 — Android APK CI.
#
# Builds the experimental Android frontend (NativeActivity + NDK) via Gradle
# and uploads the resulting APK as a workflow artifact. The desktop CI lives
# in build.yml.

name: Android APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch submodules
        run: git submodule update --init --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk-bundle"

      - name: Print NDK version
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          ls "$ANDROID_NDK_HOME/source.properties" && cat "$ANDROID_NDK_HOME/source.properties" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache NDK build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            android/app/build
          key: ndk-cxx-${{ runner.os }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.hpp', 'include/**/*.hpp', 'android/app/src/main/cpp/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: ndk-cxx-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p staging
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} staging/ \;
          ls -la staging/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChuckStation3-android-arm64-debug
          path: staging/*.apk
          if-no-files-found: error
          retention-days: 30
